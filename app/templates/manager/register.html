<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .full-width {
            grid-column: span 2;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-4xl mx-4">
        <!-- Logo -->
      
        <h2 class="text-2xl font-bold mb-6 text-center">Manager Registration</h2>
        <form method="POST" action="{{ url_for('manager_register') }}">
            <div class="form-grid">
                <!-- Personal Information -->
                <div class="mb-4">
                    <label for="first_name" class="block text-gray-700 mb-2">First Name:</label>
                    <input type="text" id="first_name" name="first_name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="last_name" class="block text-gray-700 mb-2">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="user_name" class="block text-gray-700 mb-2">Username:</label>
                    <input type="text" id="user_name" name="user_name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 mb-2">Email:</label>
                    <input type="email" id="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="phone" class="block text-gray-700 mb-2">Phone:</label>
                    <input type="text" id="phone" name="phone" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="dob" class="block text-gray-700 mb-2">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="ssn" class="block text-gray-700 mb-2">SSN:</label>
                    <input type="text" id="ssn" name="ssn" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 mb-2">Password:</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>

                <!-- Address Information -->
                <div class="mb-4">
                    <label for="address" class="block text-gray-700 mb-2">Street Address:</label>
                    <input type="text" id="address" name="address" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="city" class="block text-gray-700 mb-2">City:</label>
                    <input type="text" id="city" name="city" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="state" class="block text-gray-700 mb-2">State:</label>
                    <input type="text" id="state" name="state" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="zipcode" class="block text-gray-700 mb-2">Zipcode:</label>
                    <input type="text" id="zipcode" name="zipcode" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>

                <div class="mb-4 text-sm text-gray-600 full-width">
                    <p>Note: After registration, an administrator will review your account and assign you to a community.</p>
                </div>
                <div class="full-width">
                    <button type="submit" class="w-full bg-gray-600 text-white py-2 rounded-lg hover:bg-blue-700">Register</button>
                </div>
            </div>
        </form>
      
        <div class="mt-4 text-center">
            <a href="{{ url_for('manager_login') }}" class="text-gray-600 hover:underline">Already have an account? Login</a>
        </div>

        <div class="mt-4 text-center">
            <a href="{{ url_for('index') }}" class="text-gray-600 hover:underline">Back to Home</a>
        </div>
    </div>
</body>
</html>
