<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen flex items-center justify-center font-sans">

  <!-- Login Card -->
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">

    <!-- Branding -->
    <div class="flex flex-col items-center mb-6">
      <!-- Optional: Logo Image -->
      <!-- <img src="/static/logo.png" class="w-16 h-16 mb-2" alt="Logo"> -->
      <h2 class="text-3xl font-extrabold text-gray-800">Admin Login</h2>
      <p class="text-sm text-gray-500 mt-1">Manage listings and users securely</p>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
        <input type="email" id="email" name="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none"
          required />
      </div>

      <div class="mb-6">
        <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" id="password" name="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none"
          required />
      </div>

      <button type="submit"
        class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 rounded-lg transition duration-200">
        Login
      </button>
    </form>

    <!-- Back to Home -->
    <div class="mt-6 text-center">
      <a href="{{ url_for('index') }}" class="text-sm text-gray-600 hover:text-yellow-600 hover:underline transition">← Back to Home</a>
    </div>
  </div>

</body>
</html>
