<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .form-row {
            display: flex;
            gap: 16px;
        }
        
        .form-col {
            flex: 1;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-8">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl mx-4">
        <!-- Logo -->
      
        <h2 class="text-2xl font-bold mb-6 text-center">Tenant Registration</h2>
        <form method="POST" action="{{ url_for('register_tenant') }}">
            <h3 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2">Personal Information</h3>
            
            <div class="form-row mb-4">
                <div class="form-col">
                    <label for="name" class="block text-gray-700 mb-2">Full Name:</label>
                    <input type="text" id="name" name="name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="form-col">
                    <label for="email" class="block text-gray-700 mb-2">Email:</label>
                    <input type="email" id="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
            </div>
            
            <div class="form-row mb-4">
                <div class="form-col">
                    <label for="phone" class="block text-gray-700 mb-2">Phone:</label>
                    <input type="text" id="phone" name="phone" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="form-col">
                    <label for="dob" class="block text-gray-700 mb-2">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
            </div>
            
            <div class="form-row mb-4">
                <div class="form-col">
                    <label for="ssn" class="block text-gray-700 mb-2">SSN:</label>
                    <input type="text" id="ssn" name="ssn" placeholder="XXX-XX-XXXX" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
            </div>
            
            <h3 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2 mt-6">Address Information</h3>
            
            <div class="form-row mb-4">
                <div class="form-col">
                    <label for="address" class="block text-gray-700 mb-2">Street Address:</label>
                    <input type="text" id="address" name="address" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
            </div>
            
            <div class="form-row mb-4">
                <div class="form-col">
                    <label for="city" class="block text-gray-700 mb-2">City:</label>
                    <input type="text" id="city" name="city" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="form-col">
                    <label for="state" class="block text-gray-700 mb-2">State:</label>
                    <input type="text" id="state" name="state" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="form-col">
                    <label for="zipcode" class="block text-gray-700 mb-2">Zip Code:</label>
                    <input type="text" id="zipcode" name="zipcode" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
            </div>
            
            <h3 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2 mt-6">Account Information</h3>
            
            <div class="form-row mb-4">
                <div class="form-col">
                    <label for="password" class="block text-gray-700 mb-2">Password:</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="form-col">
                    <label for="confirm_password" class="block text-gray-700 mb-2">Confirm Password:</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-gray-600 text-white py-2 rounded-lg hover:bg-blue-700 mt-4">Register</button>
        </form>
      
        <div class="mt-4 text-center">
            <a href="{{ url_for('tenant_login') }}" class="text-gray-600 hover:underline">Already have an account? Login</a>
        </div>

        <div class="mt-4 text-center">
            <a href="{{ url_for('index') }}" class="text-gray-600 hover:underline">Back to Home</a>
        </div>
    </div>
</body>
</html>
